# check: every push to main, which is every release, and on demand. it
# builds and tests libtheme on a clean machine, the way a stranger would get
# it: go from go.mod, game from github, no config of anyone's. there is no
# nightly: between releases the code does not change.
name: check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: vet
        run: go vet ./...

      # the smoke tests load the generated schemes in a real vim and
      # neovim, and fail when either is missing: a check that cannot run
      # does not pass, and does not skip. the runner image is named above
      # (not -latest), so these are the versions that release of ubuntu
      # carries; the step prints them, and stops if either will not start.
      - name: vim and neovim, for the smoke tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends neovim vim
          nvim --version | head -n 1
          vim --version | head -n 1

      - name: test
        run: go test ./...

      # pinned, so a new release of either cannot break this check
      # between ours; each moves up in a commit of its own.
      - name: game, from github, and the staticcheck its lint runs
        run: |
          go install github.com/janearc/game/cmd/game@v0.4.0
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1

      - name: lint
        run: game lint

      - name: build
        run: game build

      - name: every command answers --age
        run: for c in bin/*; do "$c" --age; done

      - name: known and roundtrip
        run: |
          bin/libtheme known
          bin/libtheme roundtrip

      - name: visualdocs as css
        run: bin/visualdocs --css > /dev/null
